name: Backend scaffold checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://openaid:openaid@localhost:5432/openaid_test?schema=public
      JWT_SECRET: ci-only-synthetic-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
